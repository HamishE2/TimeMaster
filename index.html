<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local-first resourcing and timesheet planning." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TimeMaster</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const supportsRequiredFileAccess =
        typeof window.showOpenFilePicker === 'function'
        && typeof window.showSaveFilePicker === 'function';

      if (supportsRequiredFileAccess) {
        import('/src/main.jsx');
      } else {
        document.body.style.margin = '0';
        document.body.style.fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        document.getElementById('root').style.minHeight = '100vh';
        document.getElementById('root').style.display = 'grid';
        document.getElementById('root').style.placeItems = 'center';
        document.getElementById('root').style.padding = '24px';
        document.getElementById('root').style.boxSizing = 'border-box';
        document.getElementById('root').style.textAlign = 'center';
        document.getElementById('root').textContent = 'TimeMaster is only available on Chromium-based browsers.';
      }
    </script>
  </body>
</html>
